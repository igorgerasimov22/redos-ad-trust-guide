---
- name: Prepare both IPA servers
  hosts: ipa_servers
  become: true
  roles:
    - ipa_common

- name: Bootstrap primary IPA server
  hosts: ipa_servers
  become: true
  serial: 1
  tasks:
    - name: Run primary role
      ansible.builtin.include_role:
        name: ipa_server
      when: ipa_role == 'primary'

- name: Join replica IPA server
  hosts: ipa_servers
  become: true
  serial: 1
  tasks:
    - name: Run replica role
      ansible.builtin.include_role:
        name: ipa_replica
      when: ipa_role == 'replica'

- name: Apply IPA configuration
  hosts: "{{ ipa_primary_host }}"
  become: true
  roles:
    - ipa_config
