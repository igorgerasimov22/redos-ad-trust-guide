---
- name: Obtain Kerberos ticket for IPA admin
  ansible.builtin.shell: |
    set -o pipefail
    printf '%s\n' {{ ipa_admin_password | quote }} | kinit admin
  args:
    executable: /bin/bash
  changed_when: false
  no_log: true

- name: Ensure IPA groups exist
  freeipa.ansible_freeipa.ipagroup:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "{{ item.name }}"
    description: "{{ item.description | default(omit) }}"
    state: present
  loop: "{{ ipa_groups }}"
  no_log: true

- name: Ensure IPA users exist
  freeipa.ansible_freeipa.ipauser:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "{{ item.name }}"
    first: "{{ item.first }}"
    last: "{{ item.last }}"
    email: "{{ item.email | default(omit) }}"
    state: present
  loop: "{{ ipa_users }}"
  no_log: true

- name: Add users to groups
  freeipa.ansible_freeipa.ipagroup:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "{{ item.1 }}"
    user:
      - "{{ item.0.name }}"
    action: member
  loop: "{{ query('subelements', ipa_users, 'groups', {'skip_missing': True}) }}"
  no_log: true

- name: Ensure HBAC rules exist
  freeipa.ansible_freeipa.ipahbacrule:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "{{ item.name }}"
    description: "{{ item.description | default(omit) }}"
    usergroup: "{{ item.user_groups | default(omit) }}"
    hostcat: "{{ item.hostcat | default(omit) }}"
    servicecat: "{{ item.servicecat | default(omit) }}"
    state: present
  loop: "{{ ipa_hbac_rules }}"
  no_log: true

- name: Ensure sudo rules exist
  freeipa.ansible_freeipa.ipasudorule:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "{{ item.name }}"
    description: "{{ item.description | default(omit) }}"
    usergroup: "{{ item.user_groups | default(omit) }}"
    hostcat: "{{ item.hostcat | default(omit) }}"
    state: present
  loop: "{{ ipa_sudo_rules }}"
  no_log: true

- name: Ensure DNS records exist
  freeipa.ansible_freeipa.ipadnsrecord:
    ipaadmin_password: "{{ ipa_admin_password }}"
    zone_name: "{{ item.zone }}"
    record_name: "{{ item.name }}"
    record_type: "{{ item.type }}"
    record_value: "{{ item.value }}"
    state: present
  loop: "{{ ipa_dns_records }}"
  no_log: true
